<!-- static/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LogiTrack — Acceso</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%2310192B' stroke='%23FFB238' stroke-width='2'/%3E%3Cg stroke='%23FFB238' stroke-width='2' fill='none' stroke-linejoin='round'%3E%3Cpolygon points='32,14 46,22 32,30 18,22'/%3E%3Cpolyline points='18,22 18,42 32,50 32,30'/%3E%3Cpolyline points='46,22 46,42 32,50'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="split">
        <section class="split-panel">
            <svg class="route-pattern" viewBox="0 0 400 500" aria-hidden="true">
                <path d="M20,460 Q120,380 100,260 T220,80" fill="none" stroke="#FFB238" stroke-width="1.5" stroke-dasharray="2 10" opacity="0.35"/>
                <circle cx="20" cy="460" r="4" fill="#FFB238" opacity="0.6"/>
                <circle cx="100" cy="260" r="4" fill="#FFB238" opacity="0.6"/>
                <circle cx="220" cy="80" r="4" fill="#FFB238" opacity="0.6"/>
                <g transform="translate(230,300)" opacity="0.12" stroke="#FFB238" stroke-width="2" fill="none" stroke-linejoin="round">
                    <polygon points="60,0 120,34 60,68 0,34"/>
                    <polyline points="0,34 0,140 60,174 60,68"/>
                    <polyline points="120,34 120,140 60,174"/>
                </g>
            </svg>
            <div class="brand">
                <div class="badge">
                    <svg viewBox="0 0 64 64" width="52" height="52">
                        <g stroke="#FFB238" stroke-width="2" fill="none" stroke-linejoin="round">
                            <polygon points="32,14 46,22 32,30 18,22"/>
                            <polyline points="18,22 18,42 32,50 32,30"/>
                            <polyline points="46,22 46,42 32,50"/>
                        </g>
                    </svg>
                </div>
                <h1>LOGITRACK</h1>
                <p class="tagline">Control de bodegas, inventario y trazabilidad</p>
            </div>
        </section>

        <section class="split-panel form-panel">
            <form id="loginForm" class="manifest-card">
                <div class="manifest-seal">
                    <svg viewBox="0 0 64 64" width="36" height="36">
                        <g stroke="#10192B" stroke-width="2" fill="none" stroke-linejoin="round">
                            <polygon points="32,14 46,22 32,30 18,22"/>
                            <polyline points="18,22 18,42 32,50 32,30"/>
                            <polyline points="46,22 46,42 32,50"/>
                        </g>
                    </svg>
                </div>
                <p class="manifest-code">MANIFIESTO DE ACCESO · N.º 001</p>
                <h2>Iniciar sesión</h2>
                <p class="manifest-sub">Ingresa tus credenciales de empleado para continuar.</p>

                <label for="username">Usuario</label>
                <input type="text" id="username" required autocomplete="username">

                <label for="password">Contraseña</label>
                <input type="password" id="password" required autocomplete="current-password">

                <button type="submit" id="loginBtn">Ingresar</button>
                <p id="errorMsg" class="error" role="alert"></p>

                <p class="fine-print">LogiTrack S.A. — Sistema interno de gestión de inventario</p>
            </form>
        </section>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Verificando…';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:8080/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) throw new Error('Usuario o contraseña incorrectos');

                const data = await response.json();
                localStorage.setItem('token', data.token);
                window.location.href = 'dashboard.html';
            } catch (err) {
                errorMsg.textContent = err.message;
                btn.disabled = false;
                btn.textContent = 'Ingresar';
            }
        });
    </script>
</body>
</html>
